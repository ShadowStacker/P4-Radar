name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this tag (e.g. v1.0.0); leave empty to just build"
        required: false
        default: ""

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: 3.4in-800x800
            defaults: sdkconfig.defaults
          - name: 4in-720x720
            defaults: sdkconfig.defaults;sdkconfig.defaults.4inch
        chip:
          # ESP32-P4 v3.x (current boards) and v1.x need separate images.
          - name: chip-v3
            defaults: ""
          - name: chip-v1
            defaults: ";sdkconfig.defaults.p4rev1"
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32p4
          command: >-
            idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.board.defaults }}${{ matrix.chip.defaults }}" build 2>&1 | tee build.log;
            test "${PIPESTATUS[0]}" -eq 0 && idf.py merge-bin -o plane-radar-merged.bin
      - name: Check chip revision range
        run: |
          grep -E "^CONFIG_ESP32P4_REV_MIN_FULL|^CONFIG_ESP32P4_REV_MAX_FULL" sdkconfig
          if [ "${{ matrix.chip.name }}" = chip-v3 ]; then
            grep -q "^CONFIG_ESP32P4_REV_MAX_FULL=399" sdkconfig
          else
            grep -q "^CONFIG_ESP32P4_REV_MAX_FULL=199" sdkconfig
          fi
      - name: Report build errors
        if: failure()
        run: |
          # Surface the first errors as annotations so they show up without opening logs.
          grep -E "error:|Error:|ERROR|undefined reference|overflowed|discards section" build.log \
            | sort -u | head -20 | sed 's/^/::error::/' || true
          # Resolved component versions, as a single annotation (GitHub caps their number).
          if [ -f dependencies.lock ]; then
            echo "::notice title=Resolved components::$(grep -E '^  [a-z]|^    version:' dependencies.lock | tr -d ' ' | paste -sd' ' | sed 's/:version:/ /g')"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plane-radar-${{ matrix.board.name }}-${{ matrix.chip.name }}
          path: |
            build/plane_radar_p4.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            build/plane-radar-merged.bin
            build/plane_radar_p4.elf
            build/bootloader/bootloader.elf

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator and tests
        run: |
          cmake -S sim -B build-sim
          cmake --build build-sim -j
      - name: Core unit tests
        run: ./build-sim/core_tests
      - name: Render screenshots
        run: |
          ./build-sim/plane_radar_sim sim_out
          ./build-sim/plane_radar_sim sim_out --size 720
          ./build-sim/plane_radar_sim sim_out --size 720 --rotate 90
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: sim_out

  release:
    # Publishes a GitHub Release with flashable images, either for a pushed
    # "vX.Y.Z" tag or from a manual run with release_version set.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    needs: [firmware, simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect merged images
        run: |
          mkdir dist
          for board in 3.4in-800x800 4in-720x720; do
            for chip in chip-v3 chip-v1; do
              cp "artifacts/plane-radar-$board-$chip/plane-radar-merged.bin" "dist/plane-radar-$board-$chip-${VERSION}.bin"
              # Symbol files, so crash backtraces from this exact build can be decoded.
              cp "artifacts/plane-radar-$board-$chip/plane_radar_p4.elf" "dist/symbols-$board-$chip-${VERSION}.elf"
            done
          done
          (cd dist && sha256sum *.bin *.elf > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Extract changelog entry
        run: |
          # The "## [vX.Y.Z]" section of CHANGELOG.md becomes the top of the release notes.
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|^\[v[^\]]+\]:|\Z)", text, re.S | re.M)
          body = m.group(1).strip() if m else "See [CHANGELOG.md](CHANGELOG.md)."
          with open("changes.md", "w", encoding="utf-8") as f:
              f.write("## What's new\n\n" + body + "\n\n")
          print(body)
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download

          Flashable firmware for the Waveshare ESP32-P4 round touch displays.

          Pick the file for your board **and** your ESP32-P4 chip revision
          (`chip-v3` for revision v3.x, `chip-v1` for v0.x/v1.x). The wrong revision
          won't boot. To check yours, run `python -m esptool --chip esp32p4 chip_id`
          or connect in esptool-js and look for "Chip is ESP32-P4 (revision vX.Y)".

          | File | Board | Chip |
          |---|---|---|
          | `plane-radar-3.4in-800x800-chip-v3-*.bin` | 3.4C (800x800) | rev v3.x |
          | `plane-radar-3.4in-800x800-chip-v1-*.bin` | 3.4C (800x800) | rev v0.x / v1.x |
          | `plane-radar-4in-720x720-chip-v3-*.bin` | 4C (720x720) | rev v3.x |
          | `plane-radar-4in-720x720-chip-v1-*.bin` | 4C (720x720) | rev v0.x / v1.x |

          Each is a merged image (bootloader + partition table + app). Flash it at offset `0x0`:

          ```
          python -m esptool --chip esp32p4 -b 460800 write_flash 0x0 plane-radar-3.4in-800x800-chip-v3-<version>.bin
          ```

          Or use https://espressif.github.io/esptool-js/ from Chrome/Edge. **Change the
          Flash Address from its default 0x1000 to 0x0.** At the wrong address the board
          logs `invalid header: 0xffffffff` and resets in a loop.

          Not sure of your chip? The first serial line tells you:
          `ESP-ROM:esp32p4-eco2-...` means revision v1.x (use `chip-v1`); a v3.x chip
          (use `chip-v3`) reports a newer ROM, and esptool shows "revision v3.x".
          If the board isn't detected: hold BOOT, tap RESET, release BOOT.

          The `symbols-*.elf` files aren't for flashing. They decode crash backtraces
          (`idf.py monitor` or `riscv32-esp-elf-addr2line -pfiaC -e symbols-....elf <addresses>`).
          NOTES
          cat changes.md notes.md > release-notes.md
          echo "" >> release-notes.md
          echo "Full history: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md) · Guide: [USER_GUIDE.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/USER_GUIDE.md)" >> release-notes.md
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Plane Radar P4 $VERSION" --notes-file release-notes.md
