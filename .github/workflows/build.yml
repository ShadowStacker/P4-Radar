name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: 3.4in-800x800
            defaults: sdkconfig.defaults
          - name: 4in-720x720
            defaults: sdkconfig.defaults;sdkconfig.defaults.4inch
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32p4
          command: >-
            idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.board.defaults }}" build 2>&1 | tee build.log;
            test "${PIPESTATUS[0]}" -eq 0 && idf.py merge-bin -o plane-radar-merged.bin
      - name: Report build errors
        if: failure()
        run: |
          # Surface the first errors as annotations so they show up without opening logs.
          grep -E "error:|Error:|ERROR|undefined reference|overflowed|discards section" build.log \
            | sort -u | head -20 | sed 's/^/::error::/' || true
          # Resolved component versions, as a single annotation (GitHub caps their number).
          if [ -f dependencies.lock ]; then
            echo "::notice title=Resolved components::$(grep -E '^  [a-z]|^    version:' dependencies.lock | tr -d ' ' | paste -sd' ' | sed 's/:version:/ /g')"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plane-radar-${{ matrix.board.name }}
          path: |
            build/plane_radar_p4.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            build/plane-radar-merged.bin

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator and tests
        run: |
          cmake -S sim -B build-sim
          cmake --build build-sim -j
      - name: Core unit tests
        run: ./build-sim/core_tests
      - name: Render screenshots
        run: |
          ./build-sim/plane_radar_sim sim_out
          ./build-sim/plane_radar_sim sim_out --size 720
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: sim_out

  release:
    # Tag a commit "vX.Y.Z" to publish a GitHub Release with flashable images.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect merged images
        run: |
          mkdir dist
          for board in 3.4in-800x800 4in-720x720; do
            cp "artifacts/plane-radar-$board/plane-radar-merged.bin" "dist/plane-radar-$board-${GITHUB_REF_NAME}.bin"
          done
          (cd dist && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Flashable firmware for the Waveshare ESP32-P4 round touch displays.

          | File | Board |
          |---|---|
          | `plane-radar-3.4in-800x800-*.bin` | ESP32-P4-WIFI6-Touch-LCD-3.4C (800x800) |
          | `plane-radar-4in-720x720-*.bin` | ESP32-P4-WIFI6-Touch-LCD-4C (720x720) |

          Each is a merged image (bootloader + partition table + app). Flash it at offset `0x0`:

          ```
          python -m esptool --chip esp32p4 -b 460800 write_flash 0x0 plane-radar-3.4in-800x800-<version>.bin
          ```

          Or use https://espressif.github.io/esptool-js/ from Chrome/Edge (offset 0x0).
          If the board isn't detected: hold BOOT, tap RESET, release BOOT.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Plane Radar P4 $GITHUB_REF_NAME" --notes-file notes.md
